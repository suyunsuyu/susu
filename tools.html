<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>document.documentElement.classList.add("site-booting");setTimeout(()=>document.documentElement.classList.remove("site-booting"),3500)</script>
  <title>My Cat — Lee Su-yoon</title>
  <link rel="stylesheet" href="style.css?v=20260901-cat1">
  <link rel="stylesheet" href="fonts.css?v=20260818-imgfix2">
</head>
<body class="cat-journal-page">
  <header><a class="brand" href="index.html">LEE SU-YOON</a><a href="index.html">← HOME</a></header>
  <main class="page cats-page">
    <div class="cats-heading">
      <p class="kicker">MY CAT</p>
      <button id="cat-edit" class="edit" type="button" data-admin-only hidden>EDIT MY CAT</button>
    </div>
    <section id="cat-gallery" class="cat-gallery" data-layout="grid" aria-live="polite"></section>
    <p id="cats-empty" class="cats-empty">A quiet place for my cat.</p>
  </main>

  <dialog id="cat-editor" class="cat-editor">
    <div class="cat-editor-inner">
      <div class="cat-editor-head"><strong>MY CAT EDITOR</strong><button id="cat-editor-close" type="button" aria-label="Close">×</button></div>
      <label class="cat-layout-control">PAGE LAYOUT
        <select id="cat-layout">
          <option value="grid">SMALL GRID</option>
          <option value="masonry">FREE MASONRY</option>
          <option value="journal">LARGE JOURNAL</option>
        </select>
      </label>
      <div id="cat-item-editors" class="cat-item-editors"></div>
      <div class="cat-editor-actions">
        <button id="cat-add" class="cat-add" type="button">+ ADD PHOTO & STORY</button>
        <button id="cat-save" class="cat-save" type="button">SAVE ALL</button>
      </div>
      <p id="cat-status" class="cat-status"></p>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260818-imgfix2"></script>
  <script src="supabase-site.js?v=20260902-auth1"></script>
  <script src="cat-manager.js?v=20260901-cat1"></script>
  <script src="saved-layouts.js?v=20260818-imgfix2"></script>
  <script src="page-editor.js?v=20260818-imgfix2"></script>
  <script src="boot-ready.js?v=20260818-imgfix2"></script>
</body>
</html>

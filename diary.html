<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>document.documentElement.classList.add("site-booting");setTimeout(()=>document.documentElement.classList.remove("site-booting"),3500)</script>
  <title>Diary — Lee Su-yoon</title>
  <link rel="stylesheet" href="style.css?v=20260903-catarchive1">
  <link rel="stylesheet" href="diary-journal.css?v=20260922-book1">
  <link rel="stylesheet" href="cursor.css?v=20260921-pointer1">
  <link rel="stylesheet" href="fonts.css?v=20260818-imgfix2">
</head>
<body>
  <header><a href="index.html" class="brand">LEE SU-YOON</a><a href="index.html">← HOME</a></header>

  <main class="page diary-page diary-journal-page">
    <div class="diary-head-row">
      <p class="kicker">MY DIARY</p>
      <button id="edit-diary" class="edit diary-edit" type="button" data-admin-only hidden>EDIT DIARY ↗</button>
    </div>

    <section id="diary-book-section" class="diary-book-section" aria-label="Diary notebook">
      <div class="diary-book-controls">
        <button id="diary-prev-page" class="diary-book-arrow" type="button" aria-label="Previous diary page">←</button>

        <div id="diary-book" class="diary-book">
          <div class="diary-book-edge" aria-hidden="true"></div>
          <div id="diary-book-viewport" class="diary-book-viewport" aria-live="polite">
            <article id="diary-book-page" class="diary-book-page">
              <header class="diary-book-page-head">
                <time id="diary-page-date"></time>
                <span id="diary-page-number"></span>
              </header>
              <figure id="diary-page-photo-wrap" class="diary-page-photo-wrap" hidden>
                <img id="diary-page-photo" alt="">
              </figure>
              <p id="diary-page-copy" class="diary-page-copy"></p>
              <p id="diary-page-empty" class="diary-page-empty" hidden>NO DIARY ENTRIES YET.</p>
              <span class="diary-page-corner" aria-hidden="true"></span>
            </article>
            <div id="diary-turn-sheet" class="diary-turn-sheet" hidden aria-hidden="true"></div>
          </div>
        </div>

        <button id="diary-next-page" class="diary-book-arrow" type="button" aria-label="Next diary page">→</button>
      </div>
      <p class="diary-book-note">TURN THE PAGE · OR CHOOSE A MARKED DATE BELOW</p>
    </section>

    <section class="diary-calendar" aria-label="Diary calendar">
      <div class="diary-calendar-head">
        <p class="kicker">CALENDAR</p>
        <div class="diary-calendar-switcher">
          <button id="diary-calendar-prev" type="button" aria-label="Previous month">←</button>
          <p id="diary-calendar-month" aria-live="polite"></p>
          <button id="diary-calendar-next" type="button" aria-label="Next month">→</button>
        </div>
      </div>
      <div class="diary-calendar-weekdays" aria-hidden="true">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div id="diary-calendar-grid" class="diary-calendar-grid"></div>
    </section>
  </main>

  <dialog id="diary-dialog" class="diary-editor-dialog">
    <form id="diary-form">
      <button type="button" id="close-diary-editor" class="close" aria-label="Close editor">×</button>
      <div class="diary-editor-heading">
        <p class="kicker">DIARY EDITOR</p>
        <button id="diary-new-draft" type="button">+ NEW PAGE</button>
      </div>

      <input id="diary-edit-id" type="hidden">
      <label>DATE<input id="diary-date" type="date" required></label>
      <label>NOTE<textarea id="diary-text" rows="9" placeholder="Write here…" required></textarea></label>

      <div class="diary-style-controls">
        <label>FONT
          <select id="diary-font">
            <option value="hand">Handwritten</option>
            <option value="pen">Pen Script</option>
            <option value="cute">Cute Hand</option>
            <option value="serif">Editorial Serif</option>
            <option value="sans">Modern Sans</option>
            <option value="mono">Monospace</option>
          </select>
        </label>
        <label>SIZE
          <select id="diary-size">
            <option value="">Responsive</option>
            <option value="16">Small</option>
            <option value="19">Normal</option>
            <option value="23">Large</option>
            <option value="28">Extra large</option>
          </select>
        </label>
        <label>COLOR
          <span class="diary-color-control">
            <input id="diary-color" type="color" value="#30302d" aria-label="Text color">
            <input id="diary-color-hex" type="text" value="#30302D" maxlength="7" aria-label="Text color hex value">
          </span>
        </label>
      </div>

      <div class="diary-style-preview-wrap">
        <small>PREVIEW</small>
        <p id="diary-style-preview">Write here…</p>
      </div>

      <label>PHOTO · OPTIONAL<input id="diary-image" type="file" accept="image/*"></label>
      <label id="diary-remove-photo-wrap" class="diary-remove-photo" hidden><input id="diary-remove-photo" type="checkbox"> REMOVE CURRENT PHOTO</label>
      <button class="black diary-save-entry" type="submit" id="save-diary-entry">SAVE PAGE</button>
      <p id="diary-editor-status" class="diary-editor-status" role="status"></p>

      <div class="diary-manager-heading"><span>SAVED PAGES</span><span id="diary-manager-count"></span></div>
      <div id="diary-manager" class="diary-manager"></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260818-imgfix2"></script>
  <script src="app.js?v=20260818-imgfix2"></script>
  <script src="supabase-site.js?v=20260902-auth4"></script>
  <script src="diary-journal.js?v=20260922-book1"></script>
  <script src="saved-layouts.js?v=20260818-imgfix2"></script>
  <script src="page-editor.js?v=20260902-homeedit4"></script>
  <script src="boot-ready.js?v=20260818-imgfix2"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>document.documentElement.classList.add("site-booting");setTimeout(()=>document.documentElement.classList.remove("site-booting"),3500)</script>
  <title>My Calendar — Lee Su-yoon</title>
  <link rel="stylesheet" href="style.css?v=20260903-catarchive1">
  <link rel="stylesheet" href="diary-journal.css?v=20260922-book3">
  <link rel="stylesheet" href="cursor.css?v=20260921-pointer1">
  <link rel="stylesheet" href="fonts.css?v=20261002-three2">
  <link rel="stylesheet" href="book-calendar.css?v=1">
</head>
<body class="calendar-page"><header><a href="index.html" class="brand">LEE SU-YOON</a><a href="index.html">← HOME</a></header><main class="page calendar-main"><div class="diary-head-row"><p class="kicker">MY CALENDAR</p><button id="edit-diary" class="edit diary-edit" type="button" data-admin-only hidden>EDIT CALENDAR ↗</button></div><section class="calendar-large" aria-label="My calendar"><div class="diary-calendar-head"><p class="kicker">DAYS & MEMORIES</p><div class="diary-calendar-switcher"><button id="diary-calendar-prev" type="button" aria-label="Previous month">←</button><p id="diary-calendar-month" aria-live="polite"></p><button id="diary-calendar-next" type="button" aria-label="Next month">→</button></div></div><div class="diary-calendar-weekdays" aria-hidden="true"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div><div id="diary-calendar-grid" class="diary-calendar-grid"></div></section></main>
<dialog id="calendar-detail" class="calendar-detail"><button type="button" class="close" aria-label="Close">×</button><div id="calendar-detail-body"></div></dialog>
  <dialog id="diary-dialog" class="diary-editor-dialog">
    <form id="diary-form">
      <button type="button" id="close-diary-editor" class="close" aria-label="Close editor">×</button>
      <div class="diary-editor-heading">
        <p class="kicker">DIARY EDITOR</p>
        <button id="diary-new-draft" type="button">+ NEW DATE</button>
      </div>

      <input id="diary-edit-id" type="hidden">
      <label>DATE<input id="diary-date" type="date" required></label>
      <label>TITLE · OPTIONAL<input id="diary-title" type="text" maxlength="80" placeholder="A short title"></label>
      <label>NOTE<textarea id="diary-text" rows="9" placeholder="Write here…" required></textarea></label>

      <div class="diary-style-controls">
        <label>FONT
          <select id="diary-font"><option value="english">English · Agdasima</option><option value="korean">한국어 · Nanum Barunpen</option><option value="chinese">中文 · 寒蝉活仿宋</option></select>
        </label>
        <label>SIZE
          <select id="diary-size">
            <option value="">Responsive</option>
            <option value="16">16 px</option>
            <option value="19">19 px</option>
            <option value="23">23 px</option>
            <option value="28">28 px</option>
          </select>
        </label>
        <label>COLOR
          <span class="diary-color-control">
            <input id="diary-color" type="color" value="#30302d" aria-label="Text color">
            <input id="diary-color-hex" type="text" value="#30302D" maxlength="7" aria-label="Text color hex value">
          </span>
        </label>
      </div>

      <div class="diary-style-preview-wrap">
        <small>PREVIEW</small>
        <p id="diary-style-preview">Write here…</p>
      </div>

      <label>PHOTOS · UP TO 4<input id="diary-images" type="file" accept="image/*" multiple></label>
      <div id="diary-existing-photos" class="diary-existing-photos" hidden></div>
      <label id="diary-remove-photo-wrap" class="diary-remove-photo" hidden><input id="diary-remove-photo" type="checkbox"> REMOVE CURRENT PHOTOS</label>
      <button class="black diary-save-entry" type="submit" id="save-diary-entry">SAVE DATE</button>
      <p id="diary-editor-status" class="diary-editor-status" role="status"></p>

      <div class="diary-manager-heading"><span>SAVED DATES</span><span id="diary-manager-count"></span></div>
      <div id="diary-manager" class="diary-manager"></div>
    </form>
  </dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260818-imgfix2"></script><script src="supabase-site.js?v=20261002-font3"></script><script src="calendar-only.js?v=2"></script><script src="boot-ready.js?v=20260818-imgfix2"></script><script src="site-fonts.js?v=1"></script></body></html>

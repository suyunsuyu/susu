<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>document.documentElement.classList.add("site-booting");setTimeout(()=>document.documentElement.classList.remove("site-booting"),3500)</script>
  <title>Products — Lee Su-yoon</title>
  <link rel="stylesheet" href="style.css?v=20260903-catarchive1">
  <link rel="stylesheet" href="cursor.css?v=20260904-states2">
  <link rel="stylesheet" href="fonts.css?v=20260818-imgfix2">
</head>
<body>
  <header><a href="works.html" class="brand">PRODUCTS</a><a href="works.html">← WORKS</a></header>
  <main class="page products-page">
    <div class="products-heading">
      <div><p class="kicker">MY PRODUCTS</p><h1>Products</h1></div>
      <button id="new-product" class="edit product-add" type="button" data-admin-only hidden>ADD PRODUCT ↗</button>
    </div>

    <section class="product-toolbar" aria-label="Product filters">
      <div id="product-categories" class="product-categories"></div>
      <label class="product-sort-label">SORT
        <select id="product-sort">
          <option value="custom">CUSTOM ORDER</option>
          <option value="newest">NEWEST</option>
          <option value="name">NAME A–Z</option>
        </select>
      </label>
    </section>

    <div id="product-grid" class="product-grid"></div>
    <p id="products-empty" class="products-empty">NO PRODUCTS YET.</p>
  </main>

  <dialog id="product-detail" class="product-detail-dialog">
    <button id="close-product-detail" class="close" type="button" aria-label="Close">×</button>
    <div class="product-detail-layout">
      <div>
        <div id="product-detail-main" class="product-detail-main"></div>
        <div id="product-detail-thumbs" class="product-detail-thumbs"></div>
      </div>
      <article class="product-detail-copy">
        <small id="product-detail-category"></small>
        <h2 id="product-detail-name"></h2>
        <p id="product-detail-description"></p>
        <section id="product-detail-colors-wrap" class="product-detail-colors-wrap" hidden>
          <p class="product-color-label">AVAILABLE COLORS</p>
          <div id="product-detail-colors" class="product-color-cards"></div>
        </section>
      </article>
    </div>
  </dialog>

  <dialog id="product-editor" class="product-editor-dialog">
    <form id="product-form" class="product-editor-card">
      <div class="panel-head"><p class="kicker">PRODUCT EDITOR</p><button id="close-product-editor" type="button">×</button></div>
      <input id="product-id" type="hidden">
      <label>PRODUCT NAME<input id="product-name" maxlength="120" required></label>
      <label>CATEGORY<input id="product-category" maxlength="60" placeholder="e.g. CAT TOYS" required></label>
      <label>DESCRIPTION<textarea id="product-description" rows="7" maxlength="3000"></textarea></label>
      <fieldset class="product-colors-editor">
        <div class="product-colors-editor-head">
          <span class="product-colors-title">PRODUCT COLORS / PANTONE</span>
          <button id="add-product-color" type="button">ADD COLOR ＋</button>
        </div>
        <p class="product-colors-help">Choose the swatch color, then enter a Pantone code or any custom color name.</p>
        <div id="product-color-rows" class="product-color-rows"></div>
      </fieldset>
      <label>SORT ORDER<input id="product-order" type="number" min="0" step="1" value="0"></label>
      <label class="upload-label">ADD PRODUCT PHOTOS<input id="product-images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple></label>
      <div id="product-image-preview" class="product-image-preview"></div>
      <p id="product-status" class="save-status" aria-live="polite"></p>
      <button class="black" type="submit">SAVE PRODUCT</button>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260818-imgfix2"></script>
  <script src="supabase-site.js?v=20260902-auth4"></script>
  <script src="products.js?v=20260828-products2"></script>
  <script src="saved-layouts.js?v=20260818-imgfix2"></script>
  <script src="page-editor.js?v=20260902-homeedit4"></script>
  <script src="boot-ready.js?v=20260818-imgfix2"></script>
</body>
</html>

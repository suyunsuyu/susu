<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yumi · 2026 Calendar</title>
<link rel="stylesheet" href="style.css?v=20260921-profile1"><link rel="stylesheet" href="fonts.css?v=20261006-chisuga">
<link rel="stylesheet" href="cursor.css?v=20260921-pointer1"><link rel="stylesheet" href="cat-calendar.css?v=2-black">
</head><body class="cat-calendar-page">
<header><span class="brand" aria-hidden="true"></span><a href="index.html">← HOME</a></header>
<main class="cat-calendar-main">
<div id="calendar-view">
<nav class="cat-month-nav" aria-label="2026년 달력"><button id="diary-calendar-prev" type="button" aria-label="이전 달">←</button><span id="month-caption"></span><button id="diary-calendar-next" type="button" aria-label="다음 달">→</button></nav>
<section class="cat-calendar-sheet" aria-label="유미의 2026년 달력">
<img class="cat-calendar-art" src="assets/cat-calendar-2026.webp" alt="종이 콜라주 고양이가 그려진 벽걸이 달력" fetchpriority="high">
<div class="calendar-heading"><h1 id="diary-calendar-month" aria-live="polite"></h1></div>
<div class="calendar-overlay">
<div class="diary-calendar-weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div id="diary-calendar-grid" class="diary-calendar-grid"></div>
</div></section>
<div class="calendar-actions"><button id="calendar-print-month" type="button">이번 달 달력 저장</button><button id="edit-diary" type="button" data-admin-only hidden>기록 편집</button></div>
</div>
<section id="calendar-detail" class="cat-day-paper" hidden tabindex="-1" aria-label="날짜 기록">
<button type="button" class="close" aria-label="달력으로 돌아가기">← 달력</button>
<div id="calendar-detail-body"></div>
<nav class="cat-day-nav" aria-label="날짜 이동"><button id="cat-day-prev" type="button">← 이전 날</button><button id="cat-day-next" type="button">다음 날 →</button></nav>
</section><p id="cat-calendar-status" role="status"></p>
</main>
  <dialog id="diary-dialog" class="diary-editor-dialog">
    <form id="diary-form">
      <button type="button" id="close-diary-editor" class="close" aria-label="Close editor">×</button>
      <div class="diary-editor-heading">
        <p class="kicker">날짜 기록</p>
        <button id="diary-new-draft" type="button">+ 새 기록</button>
      </div>

      <input id="diary-edit-id" type="hidden">
      <label>날짜<input id="diary-date" type="date" required></label>
      <label>제목 · 선택<input id="diary-title" type="text" maxlength="80" placeholder="짧은 제목"></label>
      <label>글<textarea id="diary-text" rows="9" placeholder="여기에 적어 주세요…"></textarea></label>

      <div class="diary-style-controls">
        <label>글꼴
          <select id="diary-font"><option value="english">English · Agdasima</option><option value="korean">한국어 · Nanum Barunpen</option><option value="chinese">中文 · 寒蝉活仿宋</option></select>
        </label>
        <label>크기
          <select id="diary-size">
            <option value="">자동</option>
            <option value="16">16 px</option>
            <option value="19">19 px</option>
            <option value="23">23 px</option>
            <option value="28">28 px</option>
          </select>
        </label>
        <label>색상
          <span class="diary-color-control">
            <input id="diary-color" type="color" value="#30302d" aria-label="Text color">
            <input id="diary-color-hex" type="text" value="#30302D" maxlength="7" aria-label="Text color hex value">
          </span>
        </label>
      </div>

      <div class="diary-style-preview-wrap">
        <small>미리보기</small>
        <p id="diary-style-preview">여기에 적어 주세요…</p>
      </div>

      <label>사진 · 최대 4장<input id="diary-images" type="file" accept="image/*" multiple></label>
      <div id="diary-existing-photos" class="diary-existing-photos" hidden></div>
      <label id="diary-remove-photo-wrap" class="diary-remove-photo" hidden><input id="diary-remove-photo" type="checkbox"> 기존 사진 삭제</label>
      <button class="black diary-save-entry" type="submit" id="save-diary-entry">기록 저장</button>
      <p id="diary-editor-status" class="diary-editor-status" role="status"></p>

      <div class="diary-manager-heading"><span>저장된 날짜</span><span id="diary-manager-count"></span></div>
      <div id="diary-manager" class="diary-manager"></div>
    </form>
  </dialog>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260818-imgfix2"></script>
<script src="supabase-site.js?v=20261002-font3"></script><script src="monthly-print.js?v=4-fit"></script>
<script src="cat-calendar.js?v=1"></script><script src="site-fonts.js?v=4-dark"></script>
</body></html>

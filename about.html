<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY CAT — A little picture show</title>
<meta name="description" content="Umi's photo corridor and an interactive vintage television.">
<link rel="icon" type="image/png" href="assets/site-cat-icon.png?v=20261013">
<link rel="stylesheet" href="cat-photo-gallery.css?v=4-separate">
<link rel="stylesheet" href="cat-picture-show.css?v=3-separate">
</head>
<body class="cat-photo-page">
<a class="cat-home" href="index.html" aria-label="Back to home"><img src="assets/site-cat.svg?v=20261102" width="30" height="30" alt=""><span>HOME</span></a>
<main class="cat-picture-show" aria-label="Umi's picture show">
<section class="cat-photo-area is-empty" aria-label="Photo corridor">
<header class="corridor-heading"><button id="cat-photos-open" type="button" hidden>Edit corridor photos</button></header>
<div class="film-reel">
<div class="film-perforations" aria-hidden="true"></div>
<div id="cat-photo-grid" class="corridor-track" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Photo slides"></div>
<div class="film-perforations" aria-hidden="true"></div>
</div>
<div class="corridor-controls"><span id="corridor-count" aria-live="polite">00 / 00</span><div><button id="corridor-prev" type="button" aria-label="Previous photo">Previous</button><button id="corridor-play" type="button" aria-pressed="false">Play</button><button id="corridor-next" type="button" aria-label="Next photo">Next</button></div></div>
<div id="corridor-thumbnails" class="corridor-thumbnails" aria-label="Choose a photo"></div>
<p id="cat-photo-load-status" role="status"></p>
</section>
<section class="television-area tv-photo-area" aria-label="Vintage television">

<button id="tv-photos-open" type="button" hidden>Edit TV photos</button><div id="tv-photo-grid" hidden></div>
<div class="retro-tv" data-state="off">
<div class="tv-antenna" aria-hidden="true"><i></i><i></i><span></span></div>
<div class="tv-cabinet">
<div class="tv-front">
<div class="tv-screen-surround"><button id="tv-screen" class="crt-screen" type="button" aria-label="Turn television on" aria-pressed="false"><span class="crt-picture"><img id="tv-photo" alt="" hidden><span id="tv-no-signal" hidden>NO SIGNAL</span><span id="tv-channel-label" aria-hidden="true">CH 01</span></span><span class="crt-glass" aria-hidden="true"></span><span class="crt-static" aria-hidden="true"></span><span class="crt-power-light" aria-hidden="true"></span></button></div>
<div class="tv-hardware"><span class="tv-brand">UMI<br><small>COLOR TV</small></span><button id="tv-channel" class="tv-dial" type="button" aria-label="Next television channel"><span aria-hidden="true"></span></button><span class="dial-label">CHANNEL</span><div class="tv-speaker" aria-hidden="true"></div><button id="tv-power" class="tv-power-button" type="button" aria-label="Turn television on" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m-5-7a8 8 0 1 0 10 0"/></svg></button><span class="dial-label">POWER</span><i class="tv-led" aria-hidden="true"></i></div>
</div>
<div class="tv-bottom"><span>PORTABLE / SOLID STATE</span><span>● UMI–01</span></div>
</div>
<div class="tv-feet" aria-hidden="true"><i></i><i></i></div>
</div>
<div class="tv-remote"><button id="tv-prev" type="button" aria-label="Previous television channel">CH −</button><span id="tv-state-label" role="status">Television is off</span><button id="tv-next" type="button" aria-label="Next television channel">CH +</button></div>

<p id="tv-photo-load-status" role="status"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260818-imgfix2"></script>
<script src="supabase-site.js?v=20261002-font3"></script>
<script src="cat-picture-show.js?v=3-separate"></script>
<script src="cat-photo-gallery.js?v=4-separate"></script>
<script src="tv-photo-gallery.js?v=1"></script>
</body>
</html>

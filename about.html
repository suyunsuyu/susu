<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>document.documentElement.classList.add("site-booting");setTimeout(()=>document.documentElement.classList.remove("site-booting"),3500)</script>
  <title>About — Lee Su-yoon</title>
  <link rel="stylesheet" href="style.css?v=20260921-profile1">
  <link rel="stylesheet" href="cursor.css?v=20260921-pointer1">
  <link rel="stylesheet" href="fonts.css?v=20260818-imgfix2">
  <link rel="stylesheet" href="book-calendar.css?v=1">
</head>
<body class="about-book-page"><script>if(new URLSearchParams(location.search).has("embedded"))document.body.classList.add("embedded-book")</script>
  <header class="book-header"><a href="index.html" class="brand">LEE SU-YOON</a><a href="index.html">← HOME</a></header>
  <main class="book-main">
    <div class="book-wrap">
      <div id="about-book" class="about-book is-closed" aria-live="polite">
        <button id="book-cover" class="book-cover" type="button" aria-label="Open About book">
          <img src="assets/about-main.png" alt="Hand-drawn About cover"><span>ABOUT ME <small>OPEN THE BOOK →</small></span>
        </button>
        <div class="book-spread" id="book-spread" hidden>
          <div class="book-page book-left" id="book-left"></div>
          <div class="book-page book-right" id="book-right"></div>
        </div>
      </div>
      <nav class="book-tabs" aria-label="About book tabs">
        <button type="button" data-book-tab="profile">关于我</button>
        <button type="button" data-book-tab="cat">关于我的猫</button>
        <a href="guestbook.html" target="_top">给我留言</a>
        <button type="button" data-book-tab="contact">联系我</button>
        <a href="diary.html" target="_top">我的日历</a>
        <button type="button" data-book-tab="thoughts">一些我想说的话</button>
      </nav>
    </div>
    <div class="book-actions"><button id="book-close" type="button" hidden>← 关闭书本</button><button id="book-edit" type="button" data-admin-only hidden>EDIT PAGE ↗</button></div>
  </main>
  <dialog id="book-editor" class="book-editor"><form id="book-form"><button type="button" class="close" id="book-editor-close" aria-label="Close">×</button><h2 id="book-editor-heading">EDIT PAGE</h2><div id="book-editor-fields"></div><label>字体<select id="book-font"><option value="hand">Handwriting</option><option value="serif">Editorial serif</option><option value="sans">Sans serif</option><option value="mono">Monospace</option></select></label><label>字号 <span id="book-size-output"></span><input id="book-size" type="range" min="14" max="36" step="1" value="19"></label><button class="black" type="submit">SAVE</button><p id="book-status" role="status"></p></form></dialog>
  <dialog id="book-photo-dialog" class="book-photo-dialog"><button type="button" class="close" aria-label="Close">×</button><img alt="Cat photo"></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260818-imgfix2"></script>
  <script src="supabase-site.js?v=20260903-auth5"></script>
  <script src="book-about.js?v=1"></script>
  <script src="boot-ready.js?v=20260818-imgfix2"></script>
</body></html>

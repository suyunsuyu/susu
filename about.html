<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script>document.documentElement.classList.add('site-booting');setTimeout(()=>document.documentElement.classList.remove('site-booting'),5000)</script>
  <title>My Room — Lee Su-yoon</title>
  <link rel="stylesheet" href="style.css?v=20260902-room4">
  <link rel="stylesheet" href="fonts.css?v=20260818-imgfix2">
</head>
<body class="room3d-body">
  <header class="room3d-header">
    <a href="index.html" class="brand">LEE SU-YOON</a>
    <div class="room3d-header-actions">
      <span id="room-light-label">DAY</span>
      <a href="index.html">← HOME</a>
    </div>
  </header>

  <main class="room3d-page" aria-label="My room">
    <section id="room3d-stage" class="room3d-stage" aria-label="Interactive isometric personal room">
      <div id="room3d-canvas" class="room3d-canvas" aria-hidden="true"></div>
      <div id="room3d-loading" class="room3d-loading"><span></span><p>BUILDING MY ROOM</p></div>
      <button id="room-edit-entry" class="room3d-edit-entry" type="button" data-admin-only hidden>EDIT</button>
    </section>
  </main>

  <aside id="room-content" class="room-content" aria-hidden="true">
    <div class="room-content-head">
      <button id="room-content-back" type="button" hidden>← BACK</button>
      <small id="room-content-index">MY ROOM</small>
      <button id="room-content-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="room-content-body" class="room-content-body"></div>
  </aside>

  <dialog id="room-photo-lightbox" class="room-photo-lightbox">
    <button id="room-photo-close" type="button" aria-label="Close">×</button>
    <button id="room-photo-prev" type="button" aria-label="Previous photo">←</button>
    <figure><img id="room-photo-image" alt=""><figcaption><span id="room-photo-date"></span><span id="room-photo-location"></span><p id="room-photo-caption"></p></figcaption></figure>
    <button id="room-photo-next" type="button" aria-label="Next photo">→</button>
  </dialog>

  <div id="room3d-toast" class="room3d-toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=20260818-imgfix2"></script>
  <script src="supabase-site.js?v=20260902-auth1"></script>
  <script src="room-content.js?v=20260902-room4"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
  <script type="module" src="room3d.js?v=20260902-room4"></script>
  <script src="boot-ready.js?v=20260818-imgfix2"></script>
</body>
</html>

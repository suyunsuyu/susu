<style id="desktop-clear-television">
@media (width > 760px), (hover: hover) and (pointer: fine) {
  .retro-tv .tv-cabinet {
    border: 1px solid #a8b4b9;
    background: linear-gradient(142deg, #fff9, #c4d4da16 40%, #e9f0f32e 70%, #a5b6bd40);
    box-shadow: inset 0 0 0 3px #fff9, inset -3px -4px 0 #adbdc342,
      3px 3px 0 #c6d0d47a, 0 13px 24px #33474c1c;
  }

  .retro-tv .tv-screen-surround {
    border: 1px solid #a6b5bb;
    background: linear-gradient(144deg, #8fa4ab56, #f2f7f85c 50%, #a0b4ba48);
    box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #778d954a;
  }

  .retro-tv .crt-screen {
    background: #91a8af29;
    box-shadow: inset 0 0 0 1px #879ba2a3, inset 0 0 18px #69868f24;
  }

  .retro-tv .crt-glass {
    background: linear-gradient(143deg, #fff7, transparent 32%),
      radial-gradient(ellipse at center, transparent 62%, #526f7829);
    box-shadow: inset 0 0 14px #54707926;
  }

  .retro-tv:is([data-state=starting], [data-state=on], [data-state=stopping]) .crt-glass {
    background: linear-gradient(143deg, #fff2, transparent 32%),
      radial-gradient(ellipse at center, transparent 72%, #0003);
    box-shadow: none;
  }

  .retro-tv .tv-brand, .retro-tv .dial-label, .retro-tv .tv-bottom { color: #485c63; }

  .retro-tv .tv-speaker {
    background: repeating-linear-gradient(0deg, #5c747d9c 0 1px, transparent 1px 5px);
    box-shadow: none;
  }

  .retro-tv .tv-dial {
    border-color: #879ba2;
    background: repeating-conic-gradient(#d4dfe1 0deg 6deg, #a3b5bb 6deg 12deg);
    box-shadow: 1px 2px 3px #4158623b;
  }

  .retro-tv .tv-dial span, .retro-tv .tv-power-button {
    border-color: #788e96;
    background: linear-gradient(135deg, #849ba3, #3e545d);
    box-shadow: 0 1px 3px #41586255;
  }

  .retro-tv .tv-power-button svg { stroke: #eef6f8; }

  .retro-tv .tv-hardware .tv-media-modes button {
    border-color: #8b9fa6;
    background: linear-gradient(#f5f9faad, #bdcdd280);
    box-shadow: inset 0 1px #fffe, 0 1px 1px #566d764a;
    color: #40545c;
  }

  .retro-tv .tv-hardware .tv-media-modes button[aria-pressed=true] {
    background: linear-gradient(#6b818a, #40575f);
    box-shadow: inset 0 1px 2px #354950;
    color: #f7fafb;
  }

  .retro-tv .tv-antenna span, .retro-tv .tv-feet i {
    background: linear-gradient(#b4c7cdb3, #8298a080);
    box-shadow: inset 0 0 0 1px #7d959e66;
  }

  .retro-tv .tv-antenna i {
    background: linear-gradient(90deg, #6f868f, #ebf2f4, #6f868f);
  }
}
</style>

<style id="borderless-slideshow">
.film-reel[data-frame=none] { background: transparent; border: 0; border-radius: 0; box-shadow: none; }
.film-reel[data-frame=none]::before,
.film-reel[data-frame=none]::after,
.film-reel[data-frame=none] .film-perforations { display: none; }
.film-reel[data-frame=none] #cat-photo-grid.corridor-track { inset: 0; background: transparent; }
.film-reel[data-frame=none] .corridor-slide { padding: 0; background: transparent; }
.frame-style-preview .film-reel[data-frame=none] .frame-photo { inset: 0; width: 100%; height: 100%; }
.cat-photo-area:has(.film-reel[data-frame=none]) .corridor-thumbnails button {
  border: 0; padding: 0; background: transparent;
}
</style>
<style id="desktop-clear-plate-glass">
@media (width > 760px), (hover: hover) and (pointer: fine) {
  .retro-tv .tv-cabinet {
    border-color: #527d798c;
    background: linear-gradient(102deg, #fff6 0%, #fff3 10%, #fff0 11% 78%, #fff5 79%, #fff1 89%, #fff0 90%), #a5b8b511;
    box-shadow: inset 1px 1px 0 #fffc, inset -2px -1px 0 #8abbb674,
      2px 1px 0 #b2d6cf, 4px 2px 0 #396f69, 5px 3px 0 #80aba2, 0 13px 25px #243b3522;
  }
  .retro-tv .tv-screen-surround {
    background: linear-gradient(100deg, #fff5, #fff0 22% 82%, #fff5 83%, #fff0), #a5b8b519;
  }
  .retro-tv .tv-dial,
  .retro-tv .tv-dial span,
  .retro-tv .tv-power-button,
  .retro-tv .tv-hardware .tv-media-modes button,
  .television-area .tv-remote button {
    border: 1px solid #5f888080;
    background: linear-gradient(120deg, #fff9 0%, #fff0 35% 80%, #fff6 84%, #fff0 94%), #a5b8b51a;
    box-shadow: inset 0 1px 0 #fffc, inset -1px -1px 0 #9cc4b98c, 1px 2px 0 #55847980, 0 3px 4px #26463d24;
    color: #263f49;
    cursor: pointer;
  }
  .retro-tv[data-state=off] .crt-screen {
    background: #a0afac13;
    box-shadow: inset 0 0 0 1px #75938975, inset 0 0 12px #7e96901a;
  }
  .retro-tv[data-state=off] .crt-glass {
    background: linear-gradient(100deg, #fff8 0%, #fff2 18%, #fff0 19% 77%, #fff5 78%, #fff0 86%);
    box-shadow: none;
  }
  .retro-tv .tv-dial span:after { background: #486876; }
  .retro-tv .tv-power-button svg { stroke: #294b59; }
  .retro-tv .tv-power-button[aria-pressed=true],
  .retro-tv .tv-hardware .tv-media-modes button[aria-pressed=true] {
    border-color: #527987;
    background: linear-gradient(120deg, #fff9, #fff0 38%), #84b1a644;
    box-shadow: inset 0 1px 3px #4d766878, 0 1px 0 #fff;
    color: #203d49;
  }
  .television-area .tv-remote button { padding: 5px 10px; border-radius: 8px; }
}
</style>
